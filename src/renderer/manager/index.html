<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:;">
  <title>ZaloWebView Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-container">
    <header class="app-header">
      <div class="header-branding">
        <div class="brand-badge">
          <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="3" ry="3"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="header-title">ZaloWebView Manager</h1>
          <span class="header-subtitle">Quản lý phiên Webview độc lập trên Linux</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="theme-control">
          <label class="theme-label" for="theme-select">Giao diện
            <select id="theme-select" class="theme-select">
              <option value="system">Theo hệ thống</option>
              <option value="light">Sáng</option>
              <option value="dark">Tối</option>
            </select>
          </label>
        </div>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search-input" class="search-input" type="search" placeholder="Tìm theo tên hoặc địa chỉ…" aria-label="Tìm profile">
        </div>
        <button id="btn-import-profiles" class="btn" type="button" title="Nhập danh sách profile từ tệp JSON">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Nhập</span>
        </button>
        <button id="btn-export-profiles" class="btn" type="button" title="Xuất toàn bộ danh sách profile ra tệp JSON">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Xuất</span>
        </button>
        <button id="btn-add-profile" class="btn btn-primary btn-add" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Thêm Profile</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>
      <div id="import-report" class="import-report" role="status" aria-live="polite" hidden></div>
      <div id="profile-list" class="profile-grid"></div>
    </main>

    <dialog id="profile-dialog" class="profile-dialog" aria-labelledby="dialog-title">
      <form id="profile-form" class="dialog-form" method="dialog">
        <div class="dialog-header">
          <h2 id="dialog-title">Thêm Profile</h2>
        </div>
        <div class="dialog-body">
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <input id="field-id" type="hidden">

          <div class="pref-group">
            <span class="pref-group-title">Thông tin cơ bản</span>
            <label class="field">
              <span>Tên</span>
              <input id="field-name" type="text" maxlength="120" required autocomplete="off" placeholder="Ví dụ: Zalo Cá nhân, Zalo Công việc">
            </label>
            <label class="field">
              <span>Địa chỉ website</span>
              <input id="field-url" type="url" required autocomplete="off" placeholder="https://chat.zalo.me/…">
            </label>
            <label class="field">
              <span>Đường dẫn biểu tượng (tùy chọn)</span>
              <input id="field-icon" type="text" autocomplete="off" placeholder="Đường dẫn file .png/.svg hoặc URL">
            </label>
            <div class="icon-actions">
              <button id="btn-choose-icon" class="btn btn-small" type="button">Chọn file…</button>
              <button id="btn-fetch-icon" class="btn btn-small" type="button">Tải từ website</button>
            </div>
            <p id="icon-status" class="icon-status" role="status" aria-live="polite" hidden></p>
            <label class="field">
              <span>User-Agent (chỉ đặt khi tạo mới)</span>
              <input id="field-useragent" type="text" autocomplete="off" placeholder="Mặc định theo hệ thống">
            </label>
          </div>

          <fieldset class="fieldset pref-group">
            <legend class="pref-group-title">Theo dõi XPath</legend>
            <label class="field">
              <span>Selector (trống = tắt theo dõi)</span>
              <input id="field-xpath" type="text" autocomplete="off" placeholder="//span[contains(@class, 'badge')]">
            </label>
            <div class="field-row">
              <label class="field flex-1">
                <span>Chế độ</span>
                <select id="field-mode">
                  <option value="badge_count">Đếm badge</option>
                  <option value="text_content">Nội dung văn bản</option>
                  <option value="existence">Tồn tại phần tử</option>
                </select>
              </label>
              <label class="field flex-1">
                <span>Chu kỳ quét (ms, 1000–60000)</span>
                <input id="field-interval" type="number" min="1000" max="60000" step="1" value="3000">
              </label>
            </div>
          </fieldset>

          <fieldset class="fieldset pref-group">
            <legend class="pref-group-title">Tích hợp desktop</legend>
            <div class="checks-grid">
              <label class="check"><input id="check-flash" type="checkbox" checked> <span>Nhấp nháy taskbar khi có tin mới</span></label>
              <label class="check"><input id="check-badge" type="checkbox" checked> <span>Hiện số tin trên taskbar</span></label>
              <label class="check"><input id="check-tray" type="checkbox"> <span>Thu nhỏ vào khay hệ thống</span></label>
              <label class="check"><input id="check-notify" type="checkbox" checked> <span>Thông báo desktop</span></label>
              <label class="check"><input id="check-shortcut" type="checkbox" checked> <span>Tạo shortcut menu ứng dụng</span></label>
              <label class="check"><input id="check-contextmenu" type="checkbox"> <span>Cho phép menu chuột phải</span></label>
            </div>
          </fieldset>

          <div id="xpath-result" class="xpath-result" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="dialog-actions">
          <button id="btn-test-xpath" class="btn" type="button">Thử XPath</button>
          <span class="spacer"></span>
          <button id="btn-cancel" class="btn" type="button">Hủy</button>
          <button id="btn-save" class="btn btn-primary" type="submit">Lưu</button>
        </div>
      </form>
    </dialog>

    <footer class="app-footer">
      <span class="status-indicator">● Hệ thống sẵn sàng</span>
      <span class="version-label">v0.1.0 • Linux Native</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
